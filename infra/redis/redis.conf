# ============================================================================
# HYDIEMS REDIS 7.2 PRODUCTION CONFIGURATION
# Allocated Memory Budget: 16 GB (Agent 20s Presence + BullMQ Streams + Cache)
# ============================================================================
bind 0.0.0.0
port 6379
tcp-backlog 65535
timeout 0
tcp-keepalive 300
maxmemory 16gb
maxmemory-policy noeviction
appendonly yes
appendfilename "hydiems-appendonly.aof"
appendfsync everysec
save 900 1
save 300 100
save 60 10000
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
io-threads 4
io-threads-do-reads yes
