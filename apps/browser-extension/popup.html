<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HydiEms Workforce Companion</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --indigo: #6366f1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--success);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .timer-digits {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      transition: opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-indigo {
      background: var(--indigo);
    }
    .btn-warning {
      background: var(--warning);
      color: #0f172a;
    }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      padding: 7px 9px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .quick-task-row {
      display: flex;
      gap: 6px;
    }
    .quick-task-row input {
      margin-bottom: 0;
    }
    .progress-bar {
      display: flex;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #0f172a;
      margin: 8px 0;
    }
    .seg-prod { background: var(--success); }
    .seg-neut { background: var(--primary); }
    .seg-unprod { background: var(--danger); }
    .legend {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>HydiEms Agent</span>
    </div>
    <span id="statusBadge" class="status-pill">TRACKING</span>
  </div>

  <div class="card">
    <div class="timer-row">
      <div>
        <div style="font-size: 11px; color: var(--muted);">Active Session</div>
        <div id="timerDisplay" class="timer-digits">03:27:00</div>
      </div>
      <button id="toggleTimerBtn" class="btn">Pause</button>
    </div>

    <label for="taskSelect">Active Project &amp; Task</label>
    <select id="taskSelect"></select>

    <div class="quick-task-row">
      <input id="quickTaskInput" type="text" placeholder="New quick task title..." />
      <button id="addQuickTaskBtn" class="btn btn-secondary">+ Add</button>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600;">
      <span>Today's Productivity Pulse</span>
      <span id="productivePctLabel" style="color: var(--success);">75% Prod</span>
    </div>
    <div class="progress-bar">
      <div id="barProductive" class="seg-prod" style="width: 75%;"></div>
      <div id="barNeutral" class="seg-neut" style="width: 19%;"></div>
      <div id="barNonProductive" class="seg-unprod" style="width: 6%;"></div>
    </div>
    <div class="legend">
      <span id="legendProd">Prod: 3h 27m</span>
      <span id="legendNeut">Neutral: 53m</span>
      <span id="legendUnprod">Unprod: 15m</span>
    </div>
  </div>

  <div class="actions-grid">
    <button id="toggleBreakBtn" class="btn btn-warning">Take Break</button>
    <button id="togglePersonalModeBtn" class="btn btn-indigo">Personal Mode</button>
  </div>

  <div class="footer">
    <span id="spoolInfo">Spool: 0 slices queued</span>
    <button id="openConsoleBtn" class="btn btn-secondary" style="padding: 4px 9px;">Open Web Console</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
